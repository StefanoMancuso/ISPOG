# Lint and test suite at every push to main, every pull request, and from release.yml.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:                              # every run: Linux, oldest / build / newest Python
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the project
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -v

  test-os:                           # release tags only: Windows and macOS (native lxml wheels)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the project
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -v

  # The "web" job (pip install ".[dev,web]" + pytest -m web) is added in F9,
  # together with app.py and tests/test_web.py.
