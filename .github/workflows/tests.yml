# Lint and test suite at every push to main, every pull request, and from release.yml.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:                              # every run: Linux, oldest / build / newest Python
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the project
        run: pip install -e ".[dev]"
      - name: Install a virtual display for the window tests
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Lint
        run: ruff check .
      - name: Test
        run: xvfb-run -a pytest -v

  test-os:                           # release tags only: Windows and macOS (native lxml wheels)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the project
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -v

  web:                               # every run: the web version (app.py) with Gradio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Install the project
        run: pip install -e ".[dev,web]"
      - name: Test
        run: pytest -v -m web

  musescore:                         # every run: the MuseScore plugin against the Python core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the project and Qt for Python
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1
          pip install -e ".[dev]" PySide6-Essentials
      - name: Fixtures from the Python core
        run: python musescore/tests/make_fixtures.py
      - name: Engine in Node
        run: node musescore/tests/run_tests.js
      - name: Engine in the Qt JavaScript engine
        run: python musescore/tests/run_tests_qt.py
      - name: Plugin with a test double of MuseScore
        run: python musescore/tests/run_plugin_tests.py
